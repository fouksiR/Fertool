.mf h1, .mf h2, .mf .disp {
  font-family: 'Fraunces', Georgia, serif; font-weight: 700;
  letter-spacing: -0.02em; margin: 0;
}
.mf button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
.mf button:focus-visible, .mf [tabindex]:focus-visible { outline: 3px solid ${d.purple}; outline-offset: 2px; border-radius: 8px; }

.mf .shell { display: grid; grid-template-columns: 260px minmax(0,1fr) 400px; gap: 0; min-height: 100vh; }
.mf .rail { border-right: 1px solid ${d.rule}; padding: 26px 20px 110px; background: ${d.cream}; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.mf .main { padding: 30px 34px 130px; background: ${d.cream}; overflow-x: hidden; }
.mf .panel { border-left: 1px solid ${d.rule}; background: ${d.surface}; padding: 22px 24px 130px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }

@media (max-width: 1280px) { .mf .shell { grid-template-columns: 230px minmax(0,1fr); } .mf .panel { position: fixed; inset: 0 0 0 auto; width: min(430px,100%); z-index: 60; box-shadow: -20px 0 60px -30px rgba(0,0,0,.4); } }
@media (max-width: 900px) {
  .mf .shell { grid-template-columns: 1fr; }
  .mf .rail { position: static; height: auto; border-right: none; border-bottom: 1px solid ${d.rule}; padding-bottom: 20px; }
  .mf .main { padding: 22px 18px 130px; }
}

.mf .card { background: ${d.surface}; border: 1px solid ${d.rule}; border-radius: 18px; }
.mf .soft { border-radius: 18px; border: 1px solid transparent; }
.mf .lift { transition: transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s, border-color .18s; }
.mf .lift:hover { transform: translateY(-3px); box-shadow: 0 16px 34px -22px rgba(27,35,33,.4); }

.mf .step { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-radius: 14px; width: 100%; text-align: left; transition: background .16s; }
.mf .step:hover { background: ${d.wash}; }
.mf .step[data-on="true"] { background: ${d.purpleSoft}; }
.mf .stepnum { width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex-shrink: 0; background: ${d.wash}; color: ${d.ink2}; }
.mf .step[data-on="true"] .stepnum { background: ${d.purple}; color: #fff; }

.mf .btn { padding: 13px 22px; border-radius: 12px; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 9px; transition: transform .15s, box-shadow .15s, background .15s; }
.mf .btn-dark { background: ${d.forest}; color: #fff; }
.mf .btn-dark:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -14px ${d.forest}; }
.mf .btn-out { background: ${d.surface}; border: 1px solid ${d.rule}; color: ${d.ink}; }
.mf .btn-out:hover { border-color: ${d.ink3}; transform: translateY(-2px); }
.mf .btn-ghost { color: ${d.purple}; font-weight: 700; font-size: 14.5px; }

.mf .tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
.mf .tabs { display: flex; gap: 4px; border-bottom: 1px solid ${d.rule}; margin: 18px 0 0; overflow-x: auto; }
.mf .tab { padding: 11px 12px; font-size: 14px; font-weight: 500; color: ${d.ink2}; border-bottom: 2px solid transparent; white-space: nowrap; }
.mf .tab[data-on="true"] { color: ${d.purple}; border-bottom-color: ${d.purple}; font-weight: 700; }

.mf .nav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.94); backdrop-filter: blur(10px); border-top: 1px solid ${d.rule}; display: flex; justify-content: center; gap: 6px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); z-index: 70; }
.mf .navitem { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 16px; border-radius: 12px; font-size: 11.5px; font-weight: 600; color: ${d.ink2}; transition: background .15s, color .15s; }
.mf .navitem[data-on="true"] { background: ${d.wash}; color: ${d.ink}; }

.mf .prio { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: ${d.surface}; border: 1px solid ${d.rule}; border-radius: 12px; cursor: grab; }
.mf .prio[data-drag="true"] { opacity: .4; }
.mf .prio[data-over="true"] { border-color: ${d.purple}; box-shadow: 0 0 0 3px ${d.purpleSoft}; }

.mf .fitbar { position: relative; height: 9px; border-radius: 999px; background: ${d.rule}; overflow: hidden; }
.mf .fitfill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; transition: width .5s cubic-bezier(.2,.8,.3,1); }
.mf .fitband { position: absolute; top: 0; bottom: 0; background: rgba(27,35,33,.16); }

.mf .scrim { position: fixed; inset: 0; background: rgba(27,35,33,.32); z-index: 55; }
@media (prefers-reduced-motion: reduce) { .mf * { transition: none !important; } }
